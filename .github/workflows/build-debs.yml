name: "Build Debian packages"

on:
  push:
    branches:
      - "**wheel2deb**" # Temporary: remove after testing
  workflow_run:
    workflows: ["Build binaries"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of Build binaries workflow to use"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-debs:
    name: Build .deb (${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.arch }})
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            version: "24.04"
            codename: noble
            arch: amd64
            wheel_arch: x86_64
          - distro: ubuntu
            version: "24.04"
            codename: noble
            arch: arm64
            wheel_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Determine workflow run ID
        id: run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ inputs.run_id }}" ]]; then
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.workflow_run.id }}" ]]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            # For push triggers, find the latest successful Build binaries run
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow="Build binaries" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-${{ matrix.wheel_arch }}
          path: wheels
          run-id: ${{ steps.run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List wheels
        run: ls -la wheels/

      - name: Build .deb package
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ matrix.distro }}:${{ matrix.version }} \
            bash -c '
              set -ex
              apt-get update
              apt-get install -y python3 python3-pip python3-venv

              # Create virtual environment and install wheel2deb
              python3 -m venv /opt/wheel2deb-venv
              /opt/wheel2deb-venv/bin/pip install wheel2deb

              # Find the wheel file
              WHEEL_FILE=$(ls wheels/*.whl | head -1)
              echo "Processing wheel: $WHEEL_FILE"

              # Run wheel2deb to convert wheel to deb
              mkdir -p output
              /opt/wheel2deb-venv/bin/wheel2deb \
                convert \
                -c wheel2deb.yml \
                -o output \
                -x wheels \
                -i "$WHEEL_FILE"

              # Build the deb package
              cd output/python3-cargo-ament-build_*/
              dpkg-buildpackage -us -uc -b

              # Move deb to output directory
              mv ../python3-cargo-ament-build_*.deb /workspace/output/
            '

      - name: Rename .deb with codename
        run: |
          cd output
          for deb in python3-cargo-ament-build_*.deb; do
            if [[ -f "$deb" ]]; then
              # Insert codename before .deb extension
              newname="${deb%.deb}_${{ matrix.codename }}.deb"
              mv "$deb" "$newname"
              echo "Renamed: $deb -> $newname"
            fi
          done
          ls -la

      - name: Test package installation
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -v "${{ github.workspace }}/output:/debs" \
            ${{ matrix.distro }}:${{ matrix.version }} \
            bash -c '
              set -ex
              apt-get update
              apt-get install -y /debs/*.deb
              cargo-ament-build --help
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.arch }}
          path: output/*.deb

  collect-debs:
    name: Collect all .deb packages
    runs-on: ubuntu-22.04
    needs: build-debs
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: all-debs
          merge-multiple: true

      - name: List all packages
        run: |
          echo "All .deb packages:"
          ls -la all-debs/

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: all-debs/*.deb
