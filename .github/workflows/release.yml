#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that a GitHub Release with this tag is assumed to exist as a draft
# with the appropriate title/body, and will be undrafted for you.

name: Release

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.4/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          dist_args=(plan)
          if [ "$IS_PULL_REQUEST" != "true" ]; then
            dist_args=(host --steps=create --tag "$RELEASE_TAG")
          fi
          dist "${dist_args[@]}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  custom-wait-for-release-draft:
    permissions:
      contents: read
    uses: ./.github/workflows/wait-for-release-draft.yml
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    permissions:
      contents: read
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
      - custom-wait-for-release-draft
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - targets: cargo-dist target triples to build for on that runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      DIST_VERSION: 0.30.4
      DIST_TAG: ${{ needs.plan.outputs.tag }}
      TARGETS: ${{ join(matrix.targets, ' ') }}
      CONTAINER_PACKAGE_MANAGER: ${{ matrix.container && matrix.container.package_manager || '' }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install dist
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          irm "https://github.com/axodotdev/cargo-dist/releases/download/v$env:DIST_VERSION/cargo-dist-installer.ps1" | iex
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail

          need_cargo_xwin=false
          need_cargo_zigbuild=false
          need_musl_tools=false

          for target in $TARGETS; do
            case "$target" in
              x86_64-apple-darwin|aarch64-apple-darwin|x86_64-pc-windows-msvc|aarch64-pc-windows-msvc|x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu|x86_64-unknown-linux-musl|aarch64-unknown-linux-musl)
                ;;
              *)
                echo "Unexpected dist target: $target" >&2
                exit 1
                ;;
            esac

            case "$target" in
              *-pc-windows-msvc)
                need_cargo_xwin=true
                ;;
              aarch64-unknown-linux-gnu|aarch64-unknown-linux-musl)
                need_cargo_zigbuild=true
                ;;
            esac

            case "$target" in
              *-unknown-linux-musl)
                need_musl_tools=true
                ;;
            esac
          done

          if [ "$RUNNER_OS" = "Linux" ] && [ "$need_musl_tools" = true ] && { [ -z "$CONTAINER_PACKAGE_MANAGER" ] || [ "$CONTAINER_PACKAGE_MANAGER" = "apt" ]; }; then
            sudo_prefix="sudo "
            if [ -n "$CONTAINER_PACKAGE_MANAGER" ]; then
              sudo_prefix=""
            fi
            ${sudo_prefix}apt-get update
            ${sudo_prefix}apt-get install -y musl-tools
          fi

          install_pip_pkg() {
            local pkg=$1
            if command -v "$pkg" > /dev/null 2>&1; then
              return
            fi
            if [ "$RUNNER_OS" = "Linux" ] && ! command -v pip3 > /dev/null 2>&1; then
              dnf install --assumeyes python3-pip
              pip3 install --upgrade pip
            fi
            pip3 install "$pkg"
          }

          if [ "$need_cargo_xwin" = true ]; then
            install_pip_pkg cargo-xwin
          fi

          if [ "$need_cargo_zigbuild" = true ]; then
            install_pip_pkg cargo-zigbuild
          fi
      - name: Build artifacts
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail

          dist_args=(build --print=linkage --output-format=json --artifacts=local)
          if [ -n "$DIST_TAG" ]; then
            dist_args+=(--tag "$DIST_TAG")
          fi

          for target in $TARGETS; do
            case "$target" in
              x86_64-apple-darwin|aarch64-apple-darwin|x86_64-pc-windows-msvc|aarch64-pc-windows-msvc|x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu|x86_64-unknown-linux-musl|aarch64-unknown-linux-musl)
                dist_args+=(--target "$target")
                ;;
              *)
                echo "Unexpected dist target: $target" >&2
                exit 1
                ;;
            esac
          done

          dist "${dist_args[@]}" > dist-manifest.json
          echo "dist ran successfully"
      - name: Build artifacts
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $allowedTargets = @(
            'x86_64-apple-darwin',
            'aarch64-apple-darwin',
            'x86_64-pc-windows-msvc',
            'aarch64-pc-windows-msvc',
            'x86_64-unknown-linux-gnu',
            'aarch64-unknown-linux-gnu',
            'x86_64-unknown-linux-musl',
            'aarch64-unknown-linux-musl'
          )
          $distArgs = @('build', '--print=linkage', '--output-format=json', '--artifacts=local')
          if ($env:DIST_TAG) {
            $distArgs += '--tag'
            $distArgs += $env:DIST_TAG
          }

          foreach ($target in ($env:TARGETS -split ' ' | Where-Object { $_ })) {
            if ($allowedTargets -notcontains $target) {
              throw "Unexpected dist target: $target"
            }
            $distArgs += '--target'
            $distArgs += $target
          }

          & dist @distArgs > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      DIST_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          set -euo pipefail

          dist_args=(build --output-format=json --artifacts=global)
          if [ -n "$DIST_TAG" ]; then
            dist_args+=(--tag "$DIST_TAG")
          fi

          dist "${dist_args[@]}" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_TAG: ${{ needs.plan.outputs.tag }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # This is a harmless no-op for GitHub Releases, hosting for that happens in "announce"
      - id: host
        shell: bash
        run: |
          set -euo pipefail

          dist_args=(host --steps=upload --steps=release --output-format=json)
          if [ -n "$DIST_TAG" ]; then
            dist_args+=(--tag "$DIST_TAG")
          fi

          dist "${dist_args[@]}" > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v6
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json

  custom-debian-package:
    needs:
      - plan
      - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: ./.github/workflows/debian-package.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    # publish jobs get escalated permissions
    permissions:
      "id-token": "write"
      "packages": "write"

  # Create a GitHub Release while uploading all files to it
  announce:
    needs:
      - plan
      - host
      - custom-debian-package
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.custom-debian-package.result == 'skipped' || needs.custom-debian-package.result == 'success') }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          IS_PRERELEASE: ${{ fromJson(needs.host.outputs.val).announcement_is_prerelease && 'true' || 'false' }}
          RELEASE_COMMIT: "${{ github.sha }}"
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          # If we're editing a release in place, we need to upload things ahead of time
          gh release upload "$RELEASE_TAG" artifacts/*

          release_edit_args=(release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_edit_args+=(--prerelease)
          fi
          gh "${release_edit_args[@]}"
