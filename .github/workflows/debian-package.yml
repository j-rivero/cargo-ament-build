name: Build Debian Package

on:
  # TODO: remove, only for testing
  push:
    branches:
      - 'jrivero/publish-debian-packages_src'
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  build-and-upload-debian-source-package:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub token
        if: ${{ github.event_name == 'workflow_call' }}
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Determine release tag
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          tag=$(jq -r '.announcement_tag // empty' <<<"$PLAN")
          if [ -z "$tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "Failed to determine release tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build Debian source package in Docker
        shell: bash
        run: |
          cat > /tmp/Dockerfile.source <<'EOF'
          FROM ubuntu:noble

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y \
              build-essential \
              debhelper \
              devscripts \
              dh-python \
              python3-all-dev \
              python3-setuptools \
              python3-setuptools-rust \
              cargo-1.85 \
              rustc-1.85 \
              dpkg-dev \
              && rm -rf /var/lib/apt/lists/* \
              && ln -sf /usr/bin/cargo-1.85 /usr/bin/cargo \
              && ln -sf /usr/bin/rustc-1.85 /usr/bin/rustc

          WORKDIR /build/cargo-ament-build
          COPY . .

          RUN python3 <<'PYEOF' > /tmp/cargo_metadata.env
          import tomllib
          import re
          with open('Cargo.toml', 'rb') as f:
              data = tomllib.load(f)
          pkg = data['package']
          deb = pkg['metadata']['deb']

          maintainer = deb['maintainer']
          match = re.match(r'^(.+?)\s*<(.+)>$', maintainer)
          if match:
              name, email = match.groups()
          else:
              name = maintainer
              email = "unknown@example.com"

          print(f'PACKAGE_NAME="{pkg["name"]}"')
          print(f'VERSION="{pkg["version"]}"')
          print(f'DEBFULLNAME="{name}"')
          print(f'DEBEMAIL="{email}"')
          print(f'DISTRIBUTIONS="{deb["distributions"]}"')
          PYEOF

          RUN . /tmp/cargo_metadata.env && \
              upstream_dir="/tmp/${PACKAGE_NAME}-${VERSION}" && \
              mkdir -p "$upstream_dir" && \
              tar --exclude-vcs --exclude='./debian' --exclude='./target' -cf - . | tar -xf - -C "$upstream_dir" && \
              tar -C /tmp -czf "/build/${PACKAGE_NAME}_${VERSION}.orig.tar.gz" "${PACKAGE_NAME}-${VERSION}" && \
              rm -rf "$upstream_dir"

          RUN cp -r contrib/debian debian

          RUN . /tmp/cargo_metadata.env && \
              export DEBEMAIL DEBFULLNAME && \
              dch --create \
                  --package "$PACKAGE_NAME" \
                  --newversion "${VERSION}-1" \
                  --distribution "$DISTRIBUTIONS" \
                  --urgency low \
                  --force-distribution \
                  --check-dirname-level 0 \
                  "Release version ${VERSION}"

          RUN dpkg-buildpackage -us -uc -S
          EOF

          docker build --platform=linux/amd64 -f /tmp/Dockerfile.source -t debian-source-builder .

          docker create --name temp-source-container debian-source-builder
          mkdir -p source-output
          docker cp temp-source-container:/build/. source-output/

          shopt -s nullglob
          dsc_files=(source-output/*.dsc)
          source_files=(
            source-output/*.dsc
            source-output/*.orig.tar.*
            source-output/*.debian.tar.*
            source-output/*.changes
            source-output/*.buildinfo
          )

          if [ "${#dsc_files[@]}" -eq 0 ]; then
            echo "No Debian source package was built" >&2
            exit 1
          fi

          mv "${source_files[@]}" .
          rm -rf source-output
          docker rm temp-source-container

      - name: List Debian source package files
        shell: bash
        run: |
          shopt -s nullglob
          source_files=(
            ./*.dsc
            ./*.orig.tar.*
            ./*.debian.tar.*
            ./*.changes
            ./*.buildinfo
          )
          if [ "${#source_files[@]}" -eq 0 ]; then
            echo "No Debian source package files were collected" >&2
            exit 1
          fi
          ls -lh "${source_files[@]}"

      - name: Upload Debian source package
        uses: actions/upload-artifact@v4
        with:
          name: debian-source-package
          path: |
            *.dsc
            *.orig.tar.*
            *.debian.tar.*
            *.changes
            *.buildinfo

      - name: Upload Debian source package to release
        if: ${{ github.event_name == 'workflow_call' }}
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          shopt -s nullglob
          source_files=(
            ./*.dsc
            ./*.orig.tar.*
            ./*.debian.tar.*
            ./*.changes
            ./*.buildinfo
          )
          if [ "${#source_files[@]}" -eq 0 ]; then
            echo "No Debian source package files were built" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${source_files[@]}" --clobber

  build-and-upload-debian-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: noble
            arch: amd64
          - distro: noble
            arch: arm64

    steps:
      - name: Generate GitHub token
        if: ${{ github.event_name == 'workflow_call' }}
        uses: actions/create-github-app-token@v2
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Determine release tag
        shell: bash
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          tag=$(jq -r '.announcement_tag // empty' <<<"$PLAN")
          if [ -z "$tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "Failed to determine release tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Copy contrib/debian to debian
        run: cp -r contrib/debian debian

      - name: Install devscripts
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts

      - name: Generate Debian changelog
        run: |
          # Extract metadata from Cargo.toml using Python's tomllib
          python3 << 'PYEOF' > /tmp/cargo_metadata.env
          import tomllib
          import re
          with open('Cargo.toml', 'rb') as f:
              data = tomllib.load(f)
          pkg = data['package']
          deb = pkg['metadata']['deb']

          # Parse maintainer "Name <email>" format
          maintainer = deb['maintainer']
          match = re.match(r'^(.+?)\s*<(.+)>$', maintainer)
          if match:
              name, email = match.groups()
          else:
              name = maintainer
              email = "unknown@example.com"

          print(f'PACKAGE_NAME="{pkg["name"]}"')
          print(f'VERSION="{pkg["version"]}"')
          print(f'DEBFULLNAME="{name}"')
          print(f'DEBEMAIL="{email}"')
          print(f'DISTRIBUTIONS="{deb["distributions"]}"')
          PYEOF

          source /tmp/cargo_metadata.env
          export DEBEMAIL
          export DEBFULLNAME

          dch --create \
              --package "$PACKAGE_NAME" \
              --newversion "${VERSION}-1" \
              --distribution "$DISTRIBUTIONS" \
              --urgency low \
              --force-distribution \
              --check-dirname-level 0 \
              "Release version ${VERSION}"

          echo "Generated changelog:"
          cat debian/changelog

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian package in Docker
        run: |
          PLATFORM="${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}"

          cat > Dockerfile.build <<'EOF'
          FROM ubuntu:${{ matrix.distro }}

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y \
              build-essential \
              debhelper \
              dh-python \
              python3-all-dev \
              python3-setuptools \
              python3-setuptools-rust \
              cargo-1.85 \
              rustc-1.85 \
              dpkg-dev \
              && rm -rf /var/lib/apt/lists/* \
              && ln -sf /usr/bin/cargo-1.85 /usr/bin/cargo \
              && ln -sf /usr/bin/rustc-1.85 /usr/bin/rustc

          WORKDIR /build
          COPY . .

          RUN dpkg-buildpackage -us -uc -b

          EOF

          docker build --platform="$PLATFORM" -f Dockerfile.build -t debian-builder:${{ matrix.distro }}-${{ matrix.arch }} .

          # Extract the built packages from root directory where dpkg-buildpackage places them
          docker create --name temp-container debian-builder:${{ matrix.distro }}-${{ matrix.arch }}
          mkdir -p deb-output
          docker cp temp-container:/. deb-output/
          mv deb-output/*.deb . 2>/dev/null || true
          rm -rf deb-output
          docker rm temp-container

      - name: List built packages
        run: ls -lh *.deb

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.distro }}-${{ matrix.arch }}
          path: "*.deb"

      - name: Test package installation
        run: |
          PLATFORM="${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}"

          cat > Dockerfile.test <<'EOF'
          FROM ubuntu:${{ matrix.distro }}

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y \
              python3 \
              && rm -rf /var/lib/apt/lists/*

          COPY *.deb /tmp/

          RUN apt-get update && \
              apt-get install -y /tmp/*.deb || \
              (apt-get install -f -y && dpkg -i /tmp/*.deb)

          RUN which cargo-ament-build && cargo-ament-build --help

          EOF

          docker build --platform="$PLATFORM" -f Dockerfile.test -t package-tester:${{ matrix.distro }}-${{ matrix.arch }} .

      - name: Upload Debian packages to release
        if: ${{ github.event_name == 'workflow_call' }}
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          mapfile -t debs < <(compgen -G "./*.deb")
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No Debian packages were built" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${debs[@]}" --clobber
