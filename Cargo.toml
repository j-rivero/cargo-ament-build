[package]
name = "cargo-ament-build"
version = "0.1.9"
authors = ["Nikolai Morin <nnmmgit@gmail.com>"]
edition = "2021"
license = "Apache-2.0"
description = "Cargo plugin for use with colcon workspaces"
repository = "https://github.com/ros2-rust/cargo-ament-build"
readme = "README.md"
categories = ["development-tools::cargo-plugins"]
keywords = ["ros2", "colcon", "ament"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
cargo-manifest = "0.17"
pico-args = "0.4"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.22.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "buildjet-8vcpu-ubuntu-2204-arm"
aarch64-unknown-linux-musl = "buildjet-8vcpu-ubuntu-2204-arm"

# Config for 'cargo deb' - Debian package generation
[package.metadata.deb]
maintainer = "Nikolai Morin <nnmmgit@gmail.com>"
copyright = "2023, Nikolai Morin <nnmmgit@gmail.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
A Cargo plugin for use with colcon workspaces. This tool is a wrapper \
around 'cargo build' which installs build artifacts in a layout expected \
by ament and ROS 2 tools. It can be used standalone or through \
colcon-ros-cargo."""
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
  ["target/release/cargo-ament-build", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/cargo-ament-build/", "644"],
  ["LICENSE", "usr/share/doc/cargo-ament-build/", "644"],
]